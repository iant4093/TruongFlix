<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>html,body,#video,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#000}</style>
</head>
<body>
<div id="video"></div>
<script>
  let player;
  let revision = 0;
  const commands = new Set(['playVideo', 'pauseVideo', 'seekTo', 'mute', 'unMute', 'setPlaybackQuality', 'setPlaybackQualityRange']);
  const relay = (event, info) => window.parent.postMessage(JSON.stringify({ event, info }), '*');
  // Reveal only after caption modules are confirmed absent. Preserve the viewer's saved preferences.
  function checkCaptions() {
    const current = ++revision;
    relay('captionSafe', false);
    try {
      if (typeof player.getOptions !== 'function') return;
      const modules = player.getOptions();
      if (!Array.isArray(modules)) return;
      if (modules.includes('captions')) {
        // Module unloading is optional. Unsupported builds keep the parent's artwork visible.
        if (typeof player.unloadModule !== 'function') return;
        player.unloadModule('captions');
      }
      setTimeout(() => {
        if (current !== revision) return;
        try { relay('captionSafe', !player.getOptions().includes('captions')); } catch { /* artwork fallback */ }
      }, 150);
    } catch { /* artwork fallback */ }
  }
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('video', {
      host: 'https://www.youtube-nocookie.com',
      videoId: '__VIDEO_KEY__',
      playerVars: { autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, rel: 0, enablejsapi: 1, origin: window.location.origin },
      events: {
        onReady: () => { checkCaptions(); relay('onReady', null); },
        onApiChange: checkCaptions,
        onStateChange: (event) => { if (event.data === 1) checkCaptions(); relay('onStateChange', event.data); },
        onError: (event) => relay('onError', event.data),
        onAutoplayBlocked: () => relay('onError', 'autoplay-blocked'),
      },
    });
  };
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || typeof event.data !== 'string' || !player) return;
    let message;
    try { message = JSON.parse(event.data); } catch { return; }
    if (message?.event !== 'command' || !commands.has(message.func) || !Array.isArray(message.args)) return;
    try { if (typeof player[message.func] === 'function') player[message.func](...message.args); } catch { /* optional command */ }
  });
</script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
