[package]
name = "truongflix"
version = "2.0.0"
description = "TruongFlix — a lightweight local media center"
authors = ["Ian Truong"]
edition = "2021"

[lib]
name = "truongflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
source-browser-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
libsqlite3-sys = "=0.30.1"
tempfile = "3"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"
walkdir = "2"
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "fs", "process", "rt-multi-thread", "macros"] }
getrandom = "0.2"
native-tls = "0.2"
# OpenSubtitles API (needs a custom User-Agent, which webviews can't set). OS-native TLS keeps it small.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Decompresses IMDb's public .tsv.gz datasets (pure-Rust backend).
flate2 = "1"
# libmpv is loaded at runtime so the app still runs (falling back to VLC) when it's missing.
libloading = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
# Same version librqbit uses; needed to size uTP packets for VPN tunnels.
librqbit-utp = "=0.7.0"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# API keys and passwords in macOS Keychain / Windows Credential Manager.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }

[target.'cfg(windows)'.dependencies]
mdns-sd = "0.13"
souvlaki = { version = "0.8", default-features = false }
webview2-com = "=0.39.1"
# Same version souvlaki uses, so it is only compiled once.
windows = { version = "0.44", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
# Borderless video window behind the transparent TruongFlix window (built-in player), and the
# hidden game-installer automation.
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_NetworkManagement_WNet",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# Games (Windows only): reads repack installers' options, and checks installed files.
inno = "0.7"
md-5 = "0.11"
windows-webview = { version = "0.62", package = "windows", features = ["Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native video view (CAOpenGLLayer) for the built-in player.
objc2 = "0.6"
block2 = "0.6"
libc = "0.2"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSValue"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKFrameInfo"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Proc-macros (e.g. sqlx-macros) are dlopen'ed at compile time; stripping them breaks loading on macOS.
[profile.release.build-override]
strip = false

[[example]]
name = "source_browser_smoke"
required-features = ["source-browser-smoke"]

# Patched copies of two crates; each folder's PATCHES.md lists the changes.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
inno = { path = "vendor/inno" }
